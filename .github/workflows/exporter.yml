# Tests the exporter and publishes its image to ghcr.io:
#   push to main  -> :edge and :sha-<short sha>
#   tag vX.Y.Z    -> :X.Y.Z, the tag the chart uses by default (its version)
# Pull requests only build.
name: exporter

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - exporter/**
      - .github/workflows/exporter.yml
  pull_request:
    paths:
      - exporter/**
      - .github/workflows/exporter.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: exporter/go.mod
          cache-dependency-path: exporter/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mihomo-k8s-exporter
          tags: |
            type=semver,pattern={{version}}
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: exporter
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
