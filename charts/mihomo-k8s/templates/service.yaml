apiVersion: v1
kind: Service
metadata:
  name: {{ include "mihomo-k8s.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mihomo-k8s.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mihomo-k8s.selectorLabels" . | nindent 4 }}
  ports:
    - name: proxy
      port: {{ .Values.gateway.port }}
      targetPort: proxy
      protocol: TCP
